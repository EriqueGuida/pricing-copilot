[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copiloto-ai-service"
version = "1.0.0"
description = "Motor Econométrico de Otimização de Preços e Elasticidade da Demanda"
authors = [{ name = "Pricing Copilot Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.12.0,<2.0.0",
    "statsmodels>=0.14.1,<1.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "joblib>=1.3.2,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]