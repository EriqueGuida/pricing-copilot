name: CI

on:
  push:
  pull_request:

jobs:
  java:
    name: Backend Java (Maven + Testcontainers + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O runner ubuntu-latest já traz o Docker, necessário para o Testcontainers (MySQL).
      # 'verify' roda os testes unitários (surefire), os de integração (failsafe)
      # e a verificação de cobertura do domínio de preço (JaCoCo, mínimo de 80%).
      - name: Build, testes e cobertura
        run: ./mvnw -B verify

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # TODO: adicionar o job Python (pytest) quando o microsserviço FastAPI
  # entrar no repositório. Não existe código Python nesta etapa.
